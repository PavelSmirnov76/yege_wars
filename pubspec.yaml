name: yege_wars
description: "Веб-платформа для тренировки заданий КЕГЭ по информатике: каталог задач, редактор кода, запуск Python в браузере, проверка ответов и прогресс."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  intl: any
  riverpod_annotation: ^4.0.0

dev_dependencies:
  build_runner: ^2.15.1
  custom_lint: ^0.8.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^10.2.0

flutter:
  uses-material-design: true
  generate: true
