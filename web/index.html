<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description"
        content="YEGE Wars — платформа подготовки к ЕГЭ по информатике:
                 тренировка заданий КЕГЭ и решение задач на Python в браузере.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="yege_wars">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>YEGE Wars</title>
  <link rel="manifest" href="manifest.json">

  <!-- Стили индикатора первой загрузки -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0F1115;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background: #0F1115;
      z-index: 9999;
    }

    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 90, 54, 0.2);
      border-top-color: #FF5A36;
      border-radius: 50%;
      animation: loading-spin 0.9s linear infinite;
    }

    #loading .label {
      color: #FF5A36;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }

    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Индикатор первой загрузки: удаляется после первого кадра Flutter -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="label">YEGE Wars</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.remove();
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
